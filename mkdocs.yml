# MkDocs configuration for the A2A-T SDK Python documentation (port decision D26).
#
# The API Reference pages under docs/api/ are generated with mkdocstrings from the English
# docstrings of the public modules — the docstrings are the single source of the API surface, so
# the reference cannot drift from the code. The bilingual (en / zh) narrative layer lives in
# docs/en/ and docs/zh/ and is maintained by hand; see docs/language.md.

site_name: A2A-T SDK Python
site_description: >-
  Python SDK for A2A-T task prompt generation, validation, and negotiation flows,
  corresponding to the Java a2a-t-sdk 1.1.0 capability surface.
repo_url: https://github.com/project-openan/a2a-t-sdk-python
repo_name: project-openan/a2a-t-sdk-python

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            heading_level: 2
            show_root_heading: true
            show_root_full_path: false
            show_root_members_full_path: false
            show_object_description: true
            # griffe 2.x no longer collects `#:` comment docstrings, and the codebase documents
            # its constants and enum members exactly that way — without this flag the 42 error
            # codes, the StandardTemplates constant pairs and every enum member would be hidden.
            show_if_no_docstring: true
            show_bases: true
            show_source: false
            show_signature: true
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            members_order: source
            # `!^_[^_]` is the default privacy filter; the rest hide members that are real in the
            # AST but carry no reference value: the export list, module loggers, TypeVars and the
            # exception machinery inherited from the builtin base.
            filters:
              - "!^_[^_]"
              - "!^__all__$"
              - "!^logger$"
              - "!^T$"
              - "!^TReference$"
              - "!^__cause__$"
              - "!^__suppress_context__$"

nav:
  - Introduction: index.md
  - User Guide: en/user_guide.md
  - Developer Guide: en/developer_guide.md
  - API Reference:
      - Client (A2ATClient): api/client.md
      - Server (A2ATServer): api/server.md
      - Negotiation content: api/negotiation.md
      - Core: api/core.md
      - Common (resource access): api/common.md
      - Prompt rendering: api/prompt.md
  - 中文文档:
      - 用户指南: zh/用户指南.md
      - 开发指南: zh/开发指南.md
  - Documentation languages: language.md
